services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: rover_mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf

  ai_detection:
    build: ../ai_detection
    container_name: rover_ai_detection
    depends_on:
      - mosquitto

