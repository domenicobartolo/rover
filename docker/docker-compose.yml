services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: rover_mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf

  mqtt_ros_bridge:
    build: ../mqtt_ros_bridge
    container_name: rover_mqtt_ros_bridge
    depends_on:
      - mosquitto

